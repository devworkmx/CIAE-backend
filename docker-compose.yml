services:
  db:
    image: postgres:16-alpine
    container_name: ciae_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Solo se expone en localhost del host (127.0.0.1), no en 0.0.0.0.
      # Así el backend (que corre en el mismo servidor o en la misma red
      # docker) puede conectarse, pero la base de datos no queda accesible
      # desde internet si el servidor tiene IP pública.
      # Si el backend corre en un contenedor dentro de la misma red de
      # docker-compose, ni siquiera necesitas este bloque "ports": usa el
      # nombre del servicio "db" como host de conexión.
      - '127.0.0.1:5432:5432'
    volumes:
      - ciae_pgdata:/var/lib/postgresql/data

volumes:
  ciae_pgdata:
